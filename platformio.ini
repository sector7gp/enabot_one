; PoC: boton -> reproduce audio corto via MCP4725, con portal cautivo para subir el WAV.
; Board generica ESP32-S3 (DevKitC-1) usada como base para las placas "ESP32-S3 Super Mini";
; los pines de flash/USB coinciden, solo cambia el layout fisico de pines de usuario.

[env:esp32-s3-supermini]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

; --- Ajustar segun el chip real de tu placa (mirar el marcado del modulo) ---
; La mayoria de las "Super Mini" traen 4MB de flash (algunas 8MB). Si la tuya
; tiene 8MB, cambiar a 8MB aca y ajustar partitions.csv si queres mas espacio.
board_upload.flash_size = 4MB
board_build.partitions = partitions.csv
board_build.filesystem = littlefs

; Las Super Mini no tienen chip USB-UART: usan el USB nativo del S3 para
; Serial. Sin estos flags no vas a ver nada por el monitor serie.
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

monitor_speed = 115200
upload_speed = 921600
